name: CarsonCC Auto Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: carsoncc-auto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Automatic Linux build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and test
        run: |
          make clean all
          make test
          ./carsoncc examples/hello.car -S -o /tmp/hello.s
          test -s /tmp/hello.s
      - name: Test Windows backend emission
        run: |
          ./carsoncc examples/hello.car -target windows -S -o /tmp/hello.asm
          test -s /tmp/hello.asm
          grep -q "main PROC" /tmp/hello.asm
      - name: Upload Linux compiler
        uses: actions/upload-artifact@v4
        with:
          name: carsoncc-auto-linux-x86_64
          path: carsoncc
          if-no-files-found: error

  windows:
    name: Automatic Windows build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure MSVC and MASM
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build compiler
        shell: cmd
        run: cl /nologo /std:c11 /W4 /I src src\\ast.c src\\codegen.c src\\codegen_windows.c src\\ir.c src\\lexer.c src\\main.c src\\parser.c src\\semantic_full.c /Fe:carsoncc.exe
      - name: Build Windows GUI
        shell: cmd
        run: cl /nologo /std:c11 /W4 /O2 gui\\main.c user32.lib comdlg32.lib gdi32.lib /link /SUBSYSTEM:WINDOWS /OUT:CarsonCC.exe
      - name: Smoke test Windows GUI executable
        shell: powershell
        run: |
          if (!(Test-Path .\\CarsonCC.exe)) { throw "CarsonCC.exe was not created" }
          $p = Start-Process .\\CarsonCC.exe -PassThru
          Start-Sleep -Milliseconds 500
          if ($p.HasExited) { throw "CarsonCC GUI exited immediately with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Verify MASM toolchain
        shell: cmd
        run: |
          where ml64
          where link
      - name: Emit Windows assembly for hello.car
        timeout-minutes: 1
        shell: cmd
        run: |
          echo [1/4] Running CarsonCC assembly generation
          carsoncc.exe examples\\hello.car -target windows -S -o hello.asm
          if errorlevel 1 exit /b 1
          if not exist hello.asm exit /b 1
      - name: Assemble Windows hello program
        timeout-minutes: 1
        shell: cmd
        run: |
          echo [2/4] Running MASM
          ml64.exe /nologo /c /Fohello.obj hello.asm
          if errorlevel 1 exit /b 1
          if not exist hello.obj exit /b 1
      - name: Link Windows hello program
        timeout-minutes: 1
        shell: cmd
        run: |
          echo [3/4] Running Microsoft linker
          link.exe /nologo /MACHINE:X64 /SUBSYSTEM:CONSOLE /ENTRY:carsoncc_entry /OUT:hello.exe hello.obj kernel32.lib
          if errorlevel 1 exit /b 1
          if not exist hello.exe exit /b 1
      - name: Run native Windows hello program
        timeout-minutes: 1
        shell: powershell
        run: |
          Write-Host "[4/4] Running hello.exe (expected exit code 50)"
          $p = Start-Process -FilePath ".\\hello.exe" -PassThru
          if (-not $p.WaitForExit(10000)) {
            $p.Kill()
            throw "hello.exe timed out after 10 seconds"
          }
          Write-Host "hello.exe exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 50) { throw "Expected exit code 50, got $($p.ExitCode)" }
      - name: Test compiler Windows linking path
        timeout-minutes: 1
        shell: powershell
        run: |
          Write-Host "Running CarsonCC Windows linking path"
          & .\\carsoncc.exe examples\\hello.car -target windows -o hello-linked.exe
          if ($LASTEXITCODE -ne 0) { throw "CarsonCC linker path failed with exit code $LASTEXITCODE" }
          if (!(Test-Path .\\hello-linked.exe)) { throw "hello-linked.exe was not created" }
          $p = Start-Process -FilePath ".\\hello-linked.exe" -PassThru
          if (-not $p.WaitForExit(10000)) { $p.Kill(); throw "hello-linked.exe timed out after 10 seconds" }
          Write-Host "hello-linked.exe exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 50) { throw "Expected exit code 50, got $($p.ExitCode)" }
      - name: Test Windows assembly output
        shell: cmd
        run: |
          carsoncc.exe examples\\hello.car -target windows -S -o hello-check.asm
          findstr /C:"main PROC" hello-check.asm
      - name: Test portable Windows installer script
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "CarsonCC-Portable-Test"
          if (Test-Path -LiteralPath $destination) { Remove-Item -LiteralPath $destination -Recurse -Force }
          & .\\installer\\Install-CarsonCC.ps1 -InstallDir $destination
          if ($LASTEXITCODE -ne 0) { throw "Portable installer script failed with exit code $LASTEXITCODE" }
          if (!(Test-Path -LiteralPath (Join-Path $destination "carsoncc.exe"))) { throw "Portable installer did not copy carsoncc.exe" }
          if (!(Test-Path -LiteralPath (Join-Path $destination "examples\\hello.car"))) { throw "Portable installer did not copy examples" }
          Write-Host "Portable install verified at $destination"
      - name: Upload Windows compiler and GUI
        uses: actions/upload-artifact@v4
        with:
          name: carsoncc-auto-windows-x86_64
          path: |
            carsoncc.exe
            CarsonCC.exe
          if-no-files-found: error

  android:
    name: Automatic Android APK build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build CarsonCC Mobile APK
        run: |
          gradle -p mobile clean assembleRelease -PCARSONCC_VERSION="0.1.${{ github.run_number }}" -PCARSONCC_VERSION_CODE="${{ github.run_number }}" --stacktrace
          test -n "$(find mobile/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
      - name: Verify APK
        run: |
          APK="$(find mobile/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -s "$APK"
          echo "Built APK: $APK"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: carsoncc-auto-android-apk
          path: mobile/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  auto-status:
    name: Automatic build status
    if: ${{ always() }}
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform builds to pass
        run: |
          test "${{ needs.linux.result }}" = "success"
          test "${{ needs.windows.result }}" = "success"
          test "${{ needs.android.result }}" = "success"
