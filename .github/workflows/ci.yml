name: CarsonCC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carsoncc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build compiler
        run: make clean all

      - name: Run compiler tests
        run: make test

      - name: Test assembly output
        run: |
          ./carsoncc examples/hello.car -S -o hello.s
          test -s hello.s
          grep -q '.globl main' hello.s

      - name: Test function calls
        run: |
          cat > /tmp/functions.car <<'EOF'
          fn add(a, b) {
              return a + b;
          }
          fn main() {
              return add(20, 22);
          }
          EOF
          ./carsoncc /tmp/functions.car -o /tmp/functions
          set +e
          /tmp/functions
          rc=$?
          set -e
          test "$rc" -eq 42

      - name: Upload compiler binary
        uses: actions/upload-artifact@v4
        with:
          name: carsoncc-linux-x86_64
          path: carsoncc
          if-no-files-found: error

  windows:
    name: Windows compiler build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build compiler
        shell: cmd
        run: cl /nologo /std:c11 /W4 /I src src\*.c /Fe:carsoncc.exe

      - name: Upload Windows compiler
        uses: actions/upload-artifact@v4
        with:
          name: carsoncc-windows-x86_64
          path: carsoncc.exe
          if-no-files-found: error
