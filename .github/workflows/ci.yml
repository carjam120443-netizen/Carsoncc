name: CarsonCC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carsoncc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build compiler
        run: make clean all
      - name: Run compiler tests
        run: make test
      - name: Test assembly output
        run: |
          ./carsoncc examples/hello.car -S -o hello.s
          test -s hello.s
          grep -q '.globl main' hello.s
      - name: Test function calls
        run: |
          cat > /tmp/functions.car <<'EOF'
          fn add(a, b) {
              return a + b;
          }
          fn main() {
              return add(20, 22);
          }
          EOF
          ./carsoncc /tmp/functions.car -o /tmp/functions
          set +e
          /tmp/functions
          rc=$?
          set -e
          test "$rc" -eq 42
      - name: Upload compiler binary
        uses: actions/upload-artifact@v4
        with:
          name: carsoncc-linux-x86_64
          path: carsoncc
          if-no-files-found: error
      - name: Set up Java for Android APK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android APK on Linux
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: -p mobile clean assembleRelease -PCARSONCC_VERSION=0.1.${{ github.run_number }} -PCARSONCC_VERSION_CODE=${{ github.run_number }}
      - name: Upload Linux-built Android APK
        uses: actions/upload-artifact@v4
        with:
          name: carsoncc-android-apk-linux
          path: mobile/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows:
    name: Windows compiler build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build compiler
        shell: cmd
        run: cl /nologo /std:c11 /W4 /I src src\ast.c src\codegen.c src\codegen_windows.c src\ir.c src\lexer.c src\main.c src\parser.c src\semantic_full.c /Fe:carsoncc.exe
      - name: Upload Windows compiler
        uses: actions/upload-artifact@v4
        with:
          name: carsoncc-windows-x86_64
          path: carsoncc.exe
          if-no-files-found: error
      - name: Set up Java for Android APK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build SDK
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK on Windows
        shell: pwsh
        run: gradle -p mobile clean assembleRelease "-PCARSONCC_VERSION=0.1.${{ github.run_number }}" "-PCARSONCC_VERSION_CODE=${{ github.run_number }}"
      - name: Upload Windows-built Android APK
        uses: actions/upload-artifact@v4
        with:
          name: carsoncc-android-apk-windows
          path: mobile/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
