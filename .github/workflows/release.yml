name: CarsonCC Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  linux:
    name: Build Linux and Ubuntu packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: make clean all && make test
      - name: Build Debian package
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          VERSION="${VERSION#v}"
          PKG="carsoncc_${VERSION}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/doc/carsoncc"
          install -m 0755 carsoncc "$PKG/usr/bin/carsoncc"
          install -m 0644 README.md "$PKG/usr/share/doc/carsoncc/README.md"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: carsoncc
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: CarsonCC Project
          Description: Carson programming language compiler
           From-scratch Carson compiler with an x86-64 backend.
          EOF
          dpkg-deb --build "$PKG" "${PKG}.deb"
      - name: Build Linux archive
        run: |
          mkdir -p dist/carsoncc-linux-x86_64
          cp carsoncc README.md dist/carsoncc-linux-x86_64/
          cp -r examples osappreleasepackages dist/carsoncc-linux-x86_64/
          tar -C dist -czf "carsoncc-${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz" carsoncc-linux-x86_64
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carsoncc-linux-packages
          path: |
            *.deb
            *.tar.gz

  windows:
    name: Build Windows packages
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure MSVC and MASM
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build compiler
        shell: cmd
        run: cl /nologo /std:c11 /W4 /I src src\ast.c src\codegen.c src\codegen_windows.c src\ir.c src\lexer.c src\main.c src\parser.c src\semantic_full.c /Fe:carsoncc.exe
      - name: Test native Windows compiler
        shell: cmd
        run: |
          carsoncc.exe examples\hello.car -target windows -o hello.exe
          hello.exe
          if not "%ERRORLEVEL%"=="50" exit /b 1
      - name: Build Windows ZIP
        shell: pwsh
        run: |
          $dir = "dist/carsoncc-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item carsoncc.exe $dir
          Copy-Item README.md $dir
          Copy-Item -Recurse examples $dir
          Copy-Item -Recurse osappreleasepackages $dir
          Compress-Archive -Path "$dir\*" -DestinationPath "carsoncc-${{ env.RELEASE_VERSION }}-windows-x86_64.zip" -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        env:
          CARSONCC_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          $env:CARSONCC_VERSION = $env:CARSONCC_VERSION.TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "installer\CarsonCC.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse dist
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: carsoncc-windows-packages
          path: |
            *.zip
            dist\*.exe
            installer\dist\*.exe
          if-no-files-found: error

  source:
    name: Package source tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix="Carsoncc-${{ env.RELEASE_VERSION }}/" HEAD > "carsoncc-${{ env.RELEASE_VERSION }}-source.tar.gz"
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsoncc-source-package
          path: '*.tar.gz'

  release:
    name: Publish GitHub release
    needs: [linux, windows, source]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: carsoncc-linux-packages
          path: release
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: carsoncc-windows-packages
          path: release
      - name: Download source package
        uses: actions/download-artifact@v4
        with:
          name: carsoncc-source-package
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ env.RELEASE_VERSION }}"
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "CarsonCC v${VERSION}" --generate-notes
          gh release upload "$TAG" release/* --clobber
