plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carsoncc.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.carsoncc.mobile'
        minSdk 26
        targetSdk 35
        versionCode (project.findProperty('CARSONCC_VERSION_CODE') ?: '1').toInteger()
        versionName project.findProperty('CARSONCC_VERSION') ?: '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
