plugins {
    id 'com.android.application'
}

def carsonVersion = project.hasProperty('CARSONCC_VERSION') ? project.property('CARSONCC_VERSION').toString() : '0.1.0'
def carsonVersionCode = project.hasProperty('CARSONCC_VERSION_CODE') ? project.property('CARSONCC_VERSION_CODE').toString().toInteger() : 1

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.carsoncc.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.carsoncc.mobile'
        minSdk 26
        targetSdk 35
        versionCode carsonVersionCode
        versionName carsonVersion
    }

    signingConfigs {
        // Use the SDK debug keystore for CI/release artifacts so the APK is
        // cryptographically signed and directly installable on Android.
        // A production release can replace this with a private release key.
        ciRelease {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'AndroidDebugKey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ciRelease
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // AndroidX is intentionally used by the app, not just enabled in Gradle.
    implementation 'androidx.activity:activity:1.10.1'
}
